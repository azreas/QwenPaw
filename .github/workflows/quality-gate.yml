name: Quality Gate

on:
  pull_request:
    paths:
      - "src/qwenpaw/**"
      - "tests/**"
      - "scripts/quality/**"
      - "console/src/**"
      - "console/package.json"
      - "console/package-lock.json"
      - "webchat/src/**"
      - "webchat/package.json"
      - "webchat/package-lock.json"
      - "pyproject.toml"
      - ".github/workflows/quality-gate.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,enterprise]"

      - name: Build console frontend
        run: cd console && npm ci && npm run build

      - name: Copy console build into package
        run: |
          rm -rf src/qwenpaw/console/*
          mkdir -p src/qwenpaw/console
          cp -R console/dist/* src/qwenpaw/console/

      - name: Run enterprise tests with coverage
        run: |
          pytest tests/unit/enterprise tests/unit/app tests/unit/routers tests/e2e tests/performance \
            --cov=src/qwenpaw/enterprise \
            --cov=src/qwenpaw/tenancy \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Coverage gate
        run: python scripts/quality/coverage_gate.py --xml coverage.xml --min 80

      - name: Console type check
        run: cd console && npm exec -- tsc -b --noEmit

      - name: WebChat type check
        run: cd webchat && npm install && npm exec -- tsc -p tsconfig.json --noEmit

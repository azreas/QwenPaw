name: Helm Chart

on:
  pull_request:
    paths:
      - "deploy/helm/**"
      - "tests/unit/deploy/**"
      - ".github/workflows/helm-chart.yml"
  push:
    branches: [main, master, dev, develop]
    paths:
      - "deploy/helm/**"
      - "tests/unit/deploy/**"
      - ".github/workflows/helm-chart.yml"
  workflow_dispatch:

jobs:
  helm-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest
      - name: Static chart gate
        run: pytest tests/unit/deploy/test_helm_chart.py -q
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Helm lint (default)
        run: helm lint deploy/helm/qwenpaw
      - name: Helm lint (dev overlay)
        run: helm lint deploy/helm/qwenpaw -f deploy/helm/qwenpaw/values-dev.yaml
      - name: Helm lint (staging overlay)
        run: helm lint deploy/helm/qwenpaw -f deploy/helm/qwenpaw/values-staging.yaml
      - name: Helm lint (prod overlay)
        run: helm lint deploy/helm/qwenpaw -f deploy/helm/qwenpaw/values-prod.yaml
      - name: Helm template (render gate)
        run: helm template qwenpaw deploy/helm/qwenpaw -f deploy/helm/qwenpaw/values-prod.yaml > /dev/null
